name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Check all maintained sources
        run: pre-commit run clang-format --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize runtime dependencies
        # SPDK and its transitive dependencies are only needed by hardware builds.
        run: git submodule update --init --depth 1 third_party/abseil third_party/liburing
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 cmake ninja-build libssl-dev
      - name: Enable io_uring
        run: sudo sysctl -w kernel.io_uring_disabled=0
      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCELER_BUILD_TESTS=ON \
            -DCELER_BUILD_EXAMPLES=ON \
            -DCELER_KERNEL_BYPASS=OFF
      - name: Build all targets
        run: cmake --build build-ci --parallel "$(nproc)"
      - name: Run regression tests
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited
          mkdir -p build-ci/test-results
          ctest --test-dir build-ci --parallel 1 --timeout 90 \
            --no-tests=error --output-on-failure \
            --output-junit build-ci/test-results/ctest.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.arch }}
          path: |
            build-ci/test-results/
            build-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
