name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Check all maintained sources
        run: pre-commit run clang-format --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.label }}, bypass=${{ matrix.bypass }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: amd64
            runner: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            bypass: "OFF"
          - arch: arm64
            label: arm64
            runner: ubuntu-24.04-arm
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            bypass: "OFF"
          # GCC Debug needs its own coverage: Clang already preserves Task tail
          # transfers without the public -foptimize-sibling-calls option.
          - arch: amd64
            label: amd64, GCC Debug
            runner: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            bypass: "OFF"
          - arch: arm64
            label: arm64, GCC Debug
            runner: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            bypass: "OFF"
          - arch: amd64
            label: amd64
            runner: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            bypass: "ON"
          - arch: arm64
            label: arm64
            runner: ubuntu-24.04-arm
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            bypass: "ON"
          - arch: amd64
            label: amd64, GCC Debug
            runner: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            bypass: "ON"
          - arch: arm64
            label: arm64, GCC Debug
            runner: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            bypass: "ON"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize runtime dependencies
        # Software coverage remains independent of hardware source trees. The
        # bypass half compiles the complete backend set; CTest still selects
        # io_uring and hardware smoke tests remain separate.
        run: |
          git submodule update --init --depth 1 third_party/abseil third_party/liburing
          if [[ '${{ matrix.bypass }}' == ON ]]; then
            git submodule update --init --depth 1 third_party/dpdk third_party/spdk
            git -C third_party/spdk submodule update --init --depth 1 isa-l isa-l-crypto
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          packages=(build-essential clang-18 gcc-13 g++-13 cmake ninja-build libssl-dev)
          if [[ '${{ matrix.bypass }}' == ON ]]; then
            packages+=(meson python3-pyelftools python3-dev python3-jinja2 python3-tabulate
              autoconf automake libtool nasm help2man patch libnuma-dev uuid-dev
              libaio-dev libjson-c-dev libncurses-dev libkeyutils-dev pkg-config)
          fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Enable io_uring
        run: sudo sysctl -w kernel.io_uring_disabled=0
      - name: Configure
        run: |
          # The pinned ISA-L Crypto AArch64 assembly is accepted by GCC but
          # rejected by Clang's integrated assembler. Keep compiling Bycorf
          # and DPDK with the matrix compiler; select GCC only for SPDK's
          # configure-time dependency build inherited from this environment.
          if [[ '${{ matrix.bypass }}' == ON && '${{ matrix.arch }}' == arm64 && '${{ matrix.compiler }}' == clang ]]; then
            export CC=gcc-13 CXX=g++-13
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBYCORF_BUILD_TESTS=ON \
            -DBYCORF_BUILD_EXAMPLES=ON \
            -DBYCORF_KERNEL_BYPASS=${{ matrix.bypass }}
      - name: Build all targets
        run: cmake --build build-ci --parallel "$(nproc)"
      - name: Run regression tests
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited
          mkdir -p build-ci/test-results
          ctest --test-dir build-ci --parallel 1 --timeout 90 \
            --no-tests=error --output-on-failure \
            --output-junit build-ci/test-results/ctest.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.arch }}-${{ matrix.compiler }}-bypass-${{ matrix.bypass }}
          path: |
            build-ci/test-results/
            build-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
